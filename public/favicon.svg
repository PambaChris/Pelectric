<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4A24A"/>
      <stop offset="0.55" stop-color="#D9711F"/>
      <stop offset="1" stop-color="#8A3A0E"/>
    </linearGradient>
    <linearGradient id="bolt" x1="22" y1="14" x2="38" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="0.5" stop-color="#F0A35A"/>
      <stop offset="1" stop-color="#9C4516"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4A24A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F4A24A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0F0F12"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#ring)" stroke-width="5" fill="none"/>
  <!-- Inner disc -->
  <circle cx="32" cy="32" r="14" fill="#16161A"/>
  <circle cx="32" cy="32" r="14" stroke="#2A2A30" stroke-width="0.75" fill="none"/>
  <!-- Lightning bolt P -->
  <path d="M30 16 L20 36 L28 36 L24 50 L40 28 L31 28 L37 16 Z"
        fill="url(#bolt)"
        stroke="#3A1A08" stroke-width="0.6" stroke-linejoin="miter"/>
  <!-- Spark highlight -->
  <circle cx="46" cy="20" r="1.4" fill="#FFD9A8"/>
</svg>
